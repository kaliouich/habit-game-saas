# Déclenche le récap hebdomadaire par email (Pro uniquement) chaque lundi 08:00.
# No-op propre côté app tant que AUTH_RESEND_KEY n'est pas configurée.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: habit-game-weekly-recap
  namespace: default
spec:
  schedule: "0 8 * * 1" # lundi 08:00 (fuseau du cluster)
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: trigger
              image: curlimages/curl:8.11.0
              env:
                - name: CRON_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: habit-game-secrets
                      key: CRON_SECRET
              command:
                - sh
                - -c
                - >
                  curl -f -X POST http://habit-game-svc/api/cron/weekly-recap
                  -H "Authorization: Bearer $CRON_SECRET"
