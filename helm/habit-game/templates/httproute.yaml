{{- if .Values.route.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "habit-game.name" . }}-route
  namespace: {{ .Values.app.namespace }}
  labels:
    {{- include "habit-game.labels" . | nindent 4 }}
spec:
  hostnames:
    - {{ .Values.route.hostname | quote }}
  parentRefs:
    - name: {{ .Values.route.gatewayName }}
      namespace: {{ .Values.route.gatewayNamespace }}
  rules:
    - backendRefs:
        - name: {{ include "habit-game.name" . }}-svc
          port: {{ .Values.service.port }}
      matches:
        - path:
            type: PathPrefix
            value: /
{{- end }}
