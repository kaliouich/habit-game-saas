{{- if .Values.secrets.create }}
# Créé seulement si secrets.create=true. Les valeurs doivent venir de
# -f secrets.local.yaml (gitignored) ou --set-string, jamais de values.yaml
# commité. Par défaut (secrets.create=false) le chart référence un Secret
# existant (voir secrets.existingSecretName) créé hors Helm.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "habit-game.secretName" . }}
  namespace: {{ .Values.app.namespace }}
  labels:
    {{- include "habit-game.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  CRON_SECRET: {{ .Values.secrets.cronSecret | quote }}
  AUTH_SECRET: {{ .Values.secrets.authSecret | quote }}
  AUTH_URL: {{ .Values.secrets.authUrl | quote }}
  AUTH_GOOGLE_ID: {{ .Values.secrets.authGoogleId | quote }}
  AUTH_GOOGLE_SECRET: {{ .Values.secrets.authGoogleSecret | quote }}
  AUTH_RESEND_KEY: {{ .Values.secrets.authResendKey | quote }}
  EMAIL_FROM: {{ .Values.secrets.emailFrom | quote }}
  STRIPE_SECRET_KEY: {{ .Values.secrets.stripeSecretKey | quote }}
  STRIPE_PUBLISHABLE_KEY: {{ .Values.secrets.stripePublishableKey | quote }}
  STRIPE_WEBHOOK_SECRET: {{ .Values.secrets.stripeWebhookSecret | quote }}
  STRIPE_PRICE_PRO: {{ .Values.secrets.stripePricePro | quote }}
{{- end }}
