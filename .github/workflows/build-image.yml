name: Build & push image

# Chaîne GitOps, étape 1/2 : construire l'image et la publier dans un registry.
# ArgoCD ne sait pas construire d'image — il ne fait que synchroniser des
# manifestes. Sans registry, le cluster n'aurait rien à tirer (l'ancien flux
# `docker save | k3s ctr images import` imposait un accès SSH au serveur).
#
# ⚠️ Le cluster k3s tourne sur ARM64 (Oracle Ampere). Une image construite sur
# un runner x86_64 standard ne démarrerait pas (`exec format error`). D'où le
# runner `ubuntu-24.04-arm` — natif, donc sans la lenteur d'une émulation QEMU.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "helm/**/values*.yaml" # évite la boucle : le commit de tag ne relance pas un build
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

concurrency:
  # Un seul build à la fois : deux pushes rapprochés produiraient deux commits
  # de tag concurrents sur le même fichier values.
  group: build-image
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write # pour committer le nouveau tag dans values-production.yaml
      packages: write # pour pousser sur ghcr.io
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: meta
        run: |
          # Tag immuable = SHA court. Un tag mouvant (`latest`) casserait la
          # promesse GitOps : impossible de savoir quel code tourne réellement,
          # ni de revenir en arrière de façon déterministe.
          echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          # NEXT_PUBLIC_* est figé par le compilateur au build (voir Dockerfile) :
          # ces valeurs ne peuvent pas être injectées au runtime par k8s.
          build-args: |
            NEXT_PUBLIC_APP_URL=https://habitcade.com
            NEXT_PUBLIC_GOOGLE_ADSENSE_CLIENT=${{ vars.NEXT_PUBLIC_GOOGLE_ADSENSE_CLIENT }}
            NEXT_PUBLIC_ADMOB_ANDROID_BANNER_ID=${{ vars.NEXT_PUBLIC_ADMOB_ANDROID_BANNER_ID }}
            NEXT_PUBLIC_ADMOB_IOS_BANNER_ID=${{ vars.NEXT_PUBLIC_ADMOB_IOS_BANNER_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Bump image tag in Helm values
        # Étape 2/2 : c'est CE commit qu'ArgoCD observe. Le dépôt reste la
        # source de vérité de ce qui tourne en production.
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          FILE=helm/habit-game/values-production.yaml

          # Pas de sed sur un YAML : on cible la clé, pas une position de ligne.
          python3 - "$FILE" "$TAG" <<'PY'
          import re, sys
          path, tag = sys.argv[1], sys.argv[2]
          src = open(path).read()
          out = re.sub(r'(\n\s+tag:\s*)\S+', rf'\g<1>{tag}', src, count=1)
          if out == src:
              sys.exit("Clé `tag:` introuvable dans " + path)
          open(path, "w").write(out)
          PY

          if git diff --quiet; then
            echo "Tag déjà à jour, rien à committer."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "chore(deploy): image $TAG [skip ci]"
          git push
