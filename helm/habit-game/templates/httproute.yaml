{{- if .Values.route.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "habit-game.name" . }}-route
  namespace: {{ .Values.app.namespace }}
  labels:
    {{- include "habit-game.labels" . | nindent 4 }}
spec:
  # `group`, `kind` et `weight` sont ajoutés par le serveur d'API s'ils sont
  # omis. Les écrire explicitement évite un écart permanent entre le dépôt et
  # le cluster : sans ça, ArgoCD voyait cette ressource éternellement
  # OutOfSync et la resynchronisait en boucle (selfHeal). On préfère aligner
  # le manifeste sur la réalité plutôt que masquer la différence.
  hostnames:
    - {{ .Values.route.hostname | quote }}
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.route.gatewayName }}
      namespace: {{ .Values.route.gatewayNamespace }}
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: {{ include "habit-game.name" . }}-svc
          port: {{ .Values.service.port }}
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
{{- end }}
