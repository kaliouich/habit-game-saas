# Remplace le Deployment du prototype — même nom/labels pour réutiliser
# habit-game-svc et la HTTPRoute Cloudflare existante (habits.khalilaliouich.com).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: habit-game
  namespace: default
  labels:
    app: habit-game
spec:
  replicas: 1
  selector:
    matchLabels:
      app: habit-game
  template:
    metadata:
      labels:
        app: habit-game
    spec:
      containers:
        - name: habit-game
          image: habit-game:v0.10.1
          imagePullPolicy: Never # image importée localement dans k3s
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: habit-game-secrets
                  key: DATABASE_URL
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: habit-game-secrets
                  key: AUTH_SECRET
            - name: AUTH_URL
              valueFrom:
                secretKeyRef:
                  name: habit-game-secrets
                  key: AUTH_URL
            - name: AUTH_GOOGLE_ID
              valueFrom:
                secretKeyRef:
                  name: habit-game-secrets
                  key: AUTH_GOOGLE_ID
                  optional: true
            - name: AUTH_GOOGLE_SECRET
              valueFrom:
                secretKeyRef:
                  name: habit-game-secrets
                  key: AUTH_GOOGLE_SECRET
                  optional: true
            - name: AUTH_RESEND_KEY
              valueFrom:
                secretKeyRef:
                  name: habit-game-secrets
                  key: AUTH_RESEND_KEY
                  optional: true # absent tant que Resend n'est pas configuré — gating dynamique dans lib/auth.ts
            - name: EMAIL_FROM
              valueFrom:
                secretKeyRef:
                  name: habit-game-secrets
                  key: EMAIL_FROM
                  optional: true
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: habit-game-secrets
                  key: STRIPE_SECRET_KEY
                  optional: true # absent tant que Stripe n'est pas configuré — client lazy dans lib/stripe.ts
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: habit-game-secrets
                  key: STRIPE_WEBHOOK_SECRET
                  optional: true
            - name: STRIPE_PRICE_PRO
              valueFrom:
                secretKeyRef:
                  name: habit-game-secrets
                  key: STRIPE_PRICE_PRO
                  optional: true # €9.99/an — remplace STRIPE_PRICE_MONTHLY/YEARLY (6€/49€), voir PRO-PLAN.md
            - name: CRON_SECRET
              valueFrom:
                secretKeyRef:
                  name: habit-game-secrets
                  key: CRON_SECRET
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
