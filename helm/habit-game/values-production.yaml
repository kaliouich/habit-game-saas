# Overrides pour la prod k3s (habitcade.com, migré depuis habits.khalilaliouich.com
# le 2026-08-28 — l'ancien host reste listé le temps de basculer le redirect 301).
#
# ⚠️ Fichier piloté par la CI : le workflow build-image.yml réécrit `app.image.tag`
# à chaque build et committe le changement. C'est CE commit qu'ArgoCD observe
# pour déployer. Ne pas modifier le tag à la main — il serait écrasé, et surtout
# il désignerait une image que personne n'a construite.
#
# Déploiement : automatique via ArgoCD (voir argocd/application.yaml).
# Secours manuel si ArgoCD est indisponible :
#   helm upgrade --install habit-game ./helm/habit-game \
#     -f helm/habit-game/values-production.yaml

app:
  replicas: 1
  image:
    tag: sha-8dfc2de

route:
  enabled: true
  hostnames:
    - habitcade.com
    - www.habitcade.com
    - habits.khalilaliouich.com

postgres:
  enabled: true
  storage: 5Gi

# Les secrets ne transitent jamais par git : le chart se contente de référencer
# un Secret déjà présent dans le cluster (créé hors GitOps). C'est ce qui rend
# ce dépôt publiable sans risque.
secrets:
  create: false
  existingSecretName: habit-game-secrets
