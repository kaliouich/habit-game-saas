apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "habit-game.name" . }}
  namespace: {{ .Values.app.namespace }}
  labels:
    {{- include "habit-game.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.app.replicas }}
  selector:
    matchLabels:
      {{- include "habit-game.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "habit-game.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ include "habit-game.name" . }}
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag }}"
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.app.containerPort }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "habit-game.secretName" . }}
                  key: DATABASE_URL
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "habit-game.secretName" . }}
                  key: AUTH_SECRET
            - name: AUTH_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "habit-game.secretName" . }}
                  key: AUTH_URL
            - name: AUTH_GOOGLE_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "habit-game.secretName" . }}
                  key: AUTH_GOOGLE_ID
                  optional: true
            - name: AUTH_GOOGLE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "habit-game.secretName" . }}
                  key: AUTH_GOOGLE_SECRET
                  optional: true
            - name: AUTH_RESEND_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "habit-game.secretName" . }}
                  key: AUTH_RESEND_KEY
                  optional: true # absent tant que Resend n'est pas configuré — gating dynamique dans lib/auth.ts
            - name: EMAIL_FROM
              valueFrom:
                secretKeyRef:
                  name: {{ include "habit-game.secretName" . }}
                  key: EMAIL_FROM
                  optional: true
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "habit-game.secretName" . }}
                  key: STRIPE_SECRET_KEY
                  optional: true # absent tant que Stripe n'est pas configuré — client lazy dans lib/stripe.ts
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "habit-game.secretName" . }}
                  key: STRIPE_WEBHOOK_SECRET
                  optional: true
            - name: STRIPE_PRICE_PRO
              valueFrom:
                secretKeyRef:
                  name: {{ include "habit-game.secretName" . }}
                  key: STRIPE_PRICE_PRO
                  optional: true
            - name: CRON_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "habit-game.secretName" . }}
                  key: CRON_SECRET
          readinessProbe:
            httpGet:
              path: {{ .Values.app.probes.readiness.path }}
              port: {{ .Values.app.containerPort }}
            initialDelaySeconds: {{ .Values.app.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.app.probes.readiness.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.app.probes.liveness.path }}
              port: {{ .Values.app.containerPort }}
            initialDelaySeconds: {{ .Values.app.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.app.probes.liveness.periodSeconds }}
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
