# Ne JAMAIS commiter le vrai secret. Créer avec :
#   kubectl create secret generic habit-game-secrets \
#     --from-literal=POSTGRES_PASSWORD='<mot de passe fort>' \
#     --from-literal=DATABASE_URL='postgresql://habit:<mot de passe fort>@habit-postgres:5432/habitgame'
apiVersion: v1
kind: Secret
metadata:
  name: habit-game-secrets
  namespace: default
type: Opaque
stringData:
  POSTGRES_PASSWORD: CHANGE_ME
  DATABASE_URL: postgresql://habit:CHANGE_ME@habit-postgres:5432/habitgame
