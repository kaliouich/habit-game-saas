# Remplace le Deployment du prototype — même nom/labels pour réutiliser
# habit-game-svc et la HTTPRoute Cloudflare existante (habits.khalilaliouich.com).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: habit-game
  namespace: default
  labels:
    app: habit-game
spec:
  replicas: 1
  selector:
    matchLabels:
      app: habit-game
  template:
    metadata:
      labels:
        app: habit-game
    spec:
      containers:
        - name: habit-game
          image: habit-game:v0.2.0
          imagePullPolicy: Never # image importée localement dans k3s
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: habit-game-secrets
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
